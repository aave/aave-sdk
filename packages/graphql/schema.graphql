  """A year at `apy` on `netBalanceUsd`, in USD"""
  yearlyEarningsUsd: MigrationUsdVariation

  """
  The collateral on the spoke, in USD. Null for a supply that is not collateral
  """
  collateralUsd: MigrationUsdVariation

  """
  The collateral on the spoke weighted by its collateral factors, in USD: divided by the
