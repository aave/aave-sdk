  netCollateralUsd: MigrationUsdVariation

  """The debt on the spoke, in USD. Null as `collateralUsd` is"""
  debtUsd: MigrationUsdVariation

  """
  What the debt on the spoke costs, net of rewards. Null as `collateralUsd` is
  """
  borrowApy: MigrationPercentVariation

  """
  What the spoke still lets the user borrow, in USD. Null as `collateralUsd` is
  """
  borrowingPowerUsd: MigrationUsdVariation

  """The health factor on the spoke. Null as `collateralUsd` is"""
  healthFactor: MigrationHealthFactorVariation

  """
