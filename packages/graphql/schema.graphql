  """The token that must be supplied as collateral"""
  supplyToken: Currency!

  """The token that must be borrowed"""
  borrowToken: Currency!

  """Where you can go and claim the incentives"""
  claimLink: URL!
  actionKey: String
  rewardTokenAddress: String
  rewardTokenSymbol: String
  customMessage: String
  customForumLink: String
  selfApr: PercentValue
}

type MeritBorrowIncentive {
  """Extra APR for borrowing this asset from AAVE Merit program"""
  borrowAprDiscount: PercentValue!

  """Where you can go and claim the incentives"""
  claimLink: URL!
  actionKey: String
  rewardTokenAddress: String
  rewardTokenSymbol: String
  customMessage: String
  customForumLink: String
  selfApr: PercentValue
}

type MeritSavingsGhoIncentive {
  """
  APR earned for depositing GHO into Savings GHO via the AAVE Merit program
  """
  apr: PercentValue!

  """Where you can go and claim the incentives"""
  claimLink: URL!
  actionKey: String
  rewardTokenAddress: String
  rewardTokenSymbol: String
  customMessage: String
  customForumLink: String
}

type MeritSupplyIncentive {
  """Extra APR for supplying this asset from AAVE Merit program"""
  extraSupplyApr: PercentValue!

  """Where you can go and claim the incentives"""
  claimLink: URL!

  """aavechan/Merit action slug (e.g. "ethereum-sgho")."""
  actionKey: String

  """
  Reward token paid out by the campaign (often an aToken like
  aEthUSDC). Distinct from `claimLink`, which is just the landing page.
  """
  rewardTokenAddress: String
  rewardTokenSymbol: String

  """Anti-loop eligibility warning or other tooltip copy."""
  customMessage: String

  """Governance forum link with full campaign details."""
  customForumLink: String

  """
  Extra APR when a parallel "self" campaign is running for this action
  (sGHO / Safety Module lock). Null when disabled.
  """
  selfApr: PercentValue
}

"""Borrow-side incentive funded by an Aave-owned Merkl campaign."""
type MerklBorrowIncentive {
  id: RewardId!
  startDate: DateTime!
  endDate: DateTime!

  """
  Borrow APR discount sourced live from Merkl. The user effectively
  pays the borrow APR minus `borrowAprDiscount`.
  """
  borrowAprDiscount: PercentValue!
  payoutToken: Currency!
  criteria: [IncentiveCriteria!]!
  userEligible: Boolean!
  description: String
  customMessage: String
  customForumLink: String
  customClaimMessage: String
}

"""Supply-side incentive funded by an Aave-owned Merkl campaign."""
type MerklSupplyIncentive {
  id: RewardId!
  startDate: DateTime!
  endDate: DateTime!

  """
  Extra APR for suppliers in this reserve, sourced live from Merkl.
  The interface converts APR → APY for display, matching how it
  renders `AaveSupplyIncentive.extraSupplyApr` and
  `MeritSupplyIncentive.extraSupplyApr`.
  """
  extraSupplyApr: PercentValue!

  """The token the campaign pays out in."""
  payoutToken: Currency!
  criteria: [IncentiveCriteria!]!

  """
  Whether the user meets the required
  criteria. False when no user is provided and rules exist.
  """
  userEligible: Boolean!

  """Short tooltip copy for the campaign."""
  description: String

  """
  Eligibility conditions tooltip copy (anti-loop warnings, whitelist
  requirements, etc.).
  """
  customMessage: String

  """Governance forum link with full campaign details."""
  customForumLink: String

  """
  Merkl-specific call-to-action copy shown next to the claim button
  (e.g. "Rewards will be claimable starting in early August.").
  """
  customClaimMessage: String
}

type MessageData {
  owner: EvmAddress!
  spender: EvmAddress!
  value: BigInt!
  nonce: BigInt!
  deadline: Int!
}

input MigrateBorrowPositionInput {
  """
  How much of the position moves, as a percentage above 0 and up to 100, with at most two
  decimals. Every collateral and every debt moves at this same percentage
  """
  percentage: BigDecimal!
}

input MigrateEarnPositionInput {
  """The underlying token of the supply"""
  currency: EvmAddress!

  """
  How much moves, in whole tokens: above zero and at most the supply's balance
  """
  amount: BigDecimal!

  """Whether the supply is enabled as collateral on the spoke"""
  useAsCollateral: Boolean!
}

input MigratePositionRequest {
  """
  The user address whose position moves, which is also who signs and sends
  """
  user: EvmAddress!

  """The V3 market the position is in"""
  market: MarketInput!

  """The V4 spoke the position moves to"""
  spoke: EvmAddress!
  position: MigratePositionSelection!

  """
  Omitted on the first call. On the next ones, the plan and what was signed so far
  """
  signed: MigrationSignedPlanInput
}

"""Which of the user's positions in the market moves, and how much of it"""
input MigratePositionSelection @oneOf {
  """The market's borrow position: its collaterals and its debts"""
  borrow: MigrateBorrowPositionInput

  """One supply that backs no debt"""
  earn: MigrateEarnPositionInput
}

type MigrationAmountVariation {
  """The amount before the move"""
  current: DecimalValue!

  """The amount after the move"""
  after: DecimalValue!
}

type MigrationBooleanVariation {
  """The flag before the move"""
  current: Boolean!

  """The flag after the move"""
  after: Boolean!
}

input MigrationBorrowPreviewRequest {
  """The user address whose borrow position would move"""
  user: EvmAddress!

  """The V3 market the position is in"""
  market: MarketInput!

  """The V4 spoke the position would move to"""
  spoke: EvmAddress!

  """
  How much of the position moves, as a percentage above 0 and up to 100, with at most two
  decimals. Every collateral and every debt moves at this same percentage
  """
  percentage: BigDecimal!
}

enum MigrationCriterion {
  """
  The spoke lists every asset of the position, in the role the position holds it
  """
  ASSET_SUPPORTED

  """Every asset of the position is allowed to migrate"""
  ASSET_ALLOWED

  """The spoke's supply and borrow caps have room for the position"""
  LIQUIDITY_CAP

  """Moving the position leaves the hub's rates within bounds"""
  RATE_IMPACT

  """
  The position earns more once moved, and for a borrow position borrows for less
  """
  NET_APY
}

type MigrationCriterionResult {
  """The criterion judged"""
  criterion: MigrationCriterion!

  """Whether the position meets it on this spoke"""
  met: Boolean!

  """
  The underlying assets that fail it. Empty when it is met, or when the position fails as
  a whole
  """
  assets: [EvmAddress!]!
}

type MigrationDebt {
  """The currency borrowed"""
  currency: Currency!

  """The debt that would move"""
  amount: TokenAmount!
}

input MigrationEarnPreviewRequest {
  """The user address whose supply would move"""
  user: EvmAddress!

  """The V3 market the supply is in"""
  market: MarketInput!

  """The underlying token of the supply"""
  currency: EvmAddress!

  """The V4 spoke the supply would move to"""
  spoke: EvmAddress!

  """
  How much moves, in whole tokens: above zero and at most the supply's balance
  """
  amount: BigDecimal!

  """Whether the supply is enabled as collateral on the spoke"""
  useAsCollateral: Boolean!
}

"""
What the user does next to migrate. Call `migratePosition` again after each signing step,
until it answers the transaction to send
"""
union MigrationExecutionPlan = MigrationSignaturesRequired | MigrationSafeSignatureRequired | TransactionRequest

type MigrationExternalCurator {
  """The curator's name"""
  name: String!

  """The curator's icon"""
  icon: String!
}

type MigrationHealthFactorVariation {
  """The health factor before the move. Null when the spoke carries no debt"""
  current: BigDecimal

  """The health factor after the move. Null when the spoke carries no debt"""
  after: BigDecimal
}

type MigrationHub {
  """The hub address"""
  address: EvmAddress!

  """The human-friendly name for the hub"""
  name: String!

  """The party curating the hub, if any"""
  externalCurator: MigrationExternalCurator
}

"""The part of the position that would leave V3."""
type MigrationMoving {
  """The supplies moving"""
  supplies: [MigrationSupply!]!

  """The debts moving. Empty for an earn position"""
  debts: [MigrationDebt!]!

  """
  What the moving supplies are worth in USD. Null when one of the assets has no price or
  rate
  """
  suppliedUsd: BigDecimal

  """What the moving debts are worth in USD. Null as `suppliedUsd` is"""
  borrowedUsd: BigDecimal

  """
  The moving supplies less the moving debts, in USD. Null as `suppliedUsd` is
  """
  netBalanceUsd: BigDecimal
}

input MigrationOpportunitiesRequest {
  """The V3 markets to look for positions in"""
  markets: [MarketInput!]!

  """The user address whose positions could migrate"""
  user: EvmAddress!
}

"""
One V3 position that moves as a whole, with the V4 spokes it could move to.
"""
type MigrationOpportunity {
  """Whether the position earns only or borrows"""
  kind: MigrationPositionKind!

  """The V3 market the position is in"""
